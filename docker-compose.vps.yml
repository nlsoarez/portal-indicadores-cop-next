services:
  portal:
    build:
      context: .
      dockerfile: Dockerfile.vps
    container_name: portal-indicadores-cop
    restart: unless-stopped
    env_file:
      - .env.vps
    environment:
      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-8}
    ports:
      - "127.0.0.1:${PORTAL_PORT:-8501}:8501"
    tmpfs:
      - /tmp:size=512m,mode=1777
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3).read()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
